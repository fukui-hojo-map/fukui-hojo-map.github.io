  .ptab tr.hl td{background:#fff4b3} .ptab tr.gone td{color:#aaa} .ptab .lk{font-size:11.5px;color:#fff;background:var(--warn);border-radius:3px;padding:0 3px;margin-left:2px}
  .ptab th{position:sticky;top:0;background:#fbfcfa;z-index:1} .ptab button.px{border:0;background:none;color:var(--warn);font-size:16px;cursor:pointer;padding:0 4px}
  .leaflet-container{font-family:var(--sans)}
  .leaflet-control-layers-toggle{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e3a2f' stroke-width='2' stroke-linejoin='round'><path d='M12 3 3 8l9 5 9-5z'/><path d='m3 13 9 5 9-5'/><path d='m3 17.5 9 5 9-5'/></svg>");background-size:24px 24px}
  .drop-over::after{content:"ここに離すと読み込みます";position:fixed;inset:0;background:rgba(47,125,79,.85);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:9999}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;height:auto;grid-template-rows:56vh auto}
    #map{height:56vh} .side{border-top:1px solid var(--line)} .splitter{display:none}
    header{padding:8px 12px} .side{padding:10px 12px 30px}
  }
</style>
</head>
<body>
<header>
  <h1><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="8 8 84 84"><rect x="12" y="12" width="23" height="23" rx="6" fill="#f5c542"/><rect x="39" y="12" width="23" height="23" rx="6" fill="#d7d65a"/><rect x="66" y="12" width="23" height="23" rx="6" fill="#6cc24a"/><rect x="12" y="39" width="23" height="23" rx="6" fill="#d7d65a"/><rect x="39" y="39" width="23" height="23" rx="6" fill="#6cc24a"/><rect x="66" y="39" width="23" height="23" rx="6" fill="#3fa45a"/><rect x="12" y="66" width="23" height="23" rx="6" fill="#6cc24a"/><rect x="39" y="66" width="23" height="23" rx="6" fill="#3fa45a"/><rect x="66" y="66" width="23" height="23" rx="6" fill="#1f8a53"/></svg><span>ふくい圃場マップ</span></h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <button class="btn" id="btnGeo">現在地へ</button>
  <button class="btn" id="btnLink">この場所のリンクをコピー</button>
</header>
<div class="layout">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="maphint" id="maphint">地図を拡大すると区画が表示されます</div>
    <div class="mapbar">
      <div class="ctl" style="margin:0"><span id="dateCtl" style="display:inline-flex;gap:4px;align-items:center"><span style="white-space:nowrap">日付</span><select id="colorDate" title="雲で写らなかった日は出ません"></select><span class="hint" style="font-size:12.5px;white-space:nowrap">晴れた日のみ</span></span><input type="checkbox" id="colorOn" checked hidden></div>
      <div class="ctl" style="margin:2px 0 0"><span>表示モード</span><select id="fillMode"><option value="abs" selected>絶対表示</option><option value="rel">相対表示</option><option value="trend">生育傾向マップ</option></select><input type="checkbox" id="bandOn" checked hidden><button type="button" class="ib" id="mbInfo" title="説明">ⓘ</button></div>
      <div class="more"><div class="modedesc" id="modeDesc"></div><span class="pxnote" id="pxNote"></span></div>
      <div class="bar" id="lgBar"></div><div class="lbl" id="lgLbl"><span>低い 0.2</span><span>NDVI</span><span>0.9 高い</span></div>
    </div>
  </div>
  <div class="splitter" id="splitter" title="ドラッグで地図とグラフの幅を変えられます（ダブルクリックで元に戻す）"></div>
  <aside class="side">
    <div id="privBoxes"></div>
    <div id="selArea">
    <h2>選んだ圃場 <span class="hint">（地図をタップ・最大10枚）</span></h2>
    <div class="chips" id="chips"></div>
    <div class="ctl">
      <button class="btn small" id="btnClear">すべて解除</button> <button class="btn small" id="btnXlsx" title="選んだ圃場の一覧（作物・NDVI。スコアマップのときは点数も）と、番号つきの地図を Excel に保存">Excelで保存</button>
      <label style="display:none"><input type="checkbox" id="nbOn">近隣の田の平均も表示</label>
    </div>
    <div class="rankbox" id="rankBox"></div>
    <h2>推移</h2>
    <div class="ctl chartctl"><span id="modeCtl">
      <select id="mode">
        <option value="date">今年（5/10〜9/30）</option>
        <option value="doy">前年と重ねる（5/10〜9/30）</option>
      </select></span>
    </div>
    <div class="hint" id="trendHint" style="display:none">生育傾向マップのときは、グラフは稲の年ごとに、いちばん茂った時の NDVI を「近くの、同じころに植えて同じころに刈った田」の平均とくらべた差を表示します（上ほど、その年よく育った）</div>
    <div class="status" id="status"></div>
    <div class="svgwrap"><svg class="chart" id="chart" viewBox="0 0 560 340" role="img" aria-label="NDVI推移"></svg><div class="tip" id="tip"></div></div>
    <div class="ctl"><button class="btn small" id="btnPng">グラフを画像で保存</button><span class="hint" id="note"></span></div>
    <h2 id="sumH" hidden>要約</h2>
    <table id="sum"></table>
    </div>
    <!-- 詳細設定は画面に出さない（初期値のまま自動で働く） -->
    <div hidden>
      <div class="ctl"><label>有効画素率 <input type="number" id="thr" min="50" max="100" step="5" value="70" style="width:64px">% 以上</label>
        <label>近隣の半径 <input type="number" id="nbR" min="100" max="2000" step="100" value="500" style="width:72px">m</label></div>
      <div class="ctl"><label><input type="checkbox" id="dipOn" checked>1区画だけ前後より0.1以上低いV字の点（雲・かすみの疑い）を灰色にして線から外す</label></div>
      <div class="ctl"><label><input type="checkbox" id="lsOn" checked>Landsat の点は、前後3日以内に Sentinel-2 がない日だけ使い、前後の Sentinel-2 と0.08以上違う点は除く</label></div>
      <div class="ctl"><label><input type="checkbox" id="radarOn">レーダー（Sentinel-1）から推定した点を表示（5/10〜7/31、精度が低いので参考）</label></div>
      <div class="excl" id="excl"></div>
      <div class="ctl"><select id="addExcl"></select><button class="btn small" id="btnAddExcl">この日を除外</button></div>
    </div>
    <div class="foot" id="foot"></div>
  </aside>
</div>

<script>
// 1枚目から順に 青・赤・緑・オレンジ・紫、そのあと 水色・茶・ピンク・黄土・灰・黄緑・紺・青緑・えんじ・オリーブ・空色・サーモン・深緑・薄紫・青紫
const PALETTE=['#1a73e8','#d93025','#188038','#f57c00','#9334e6','#12b5cb','#795548','#e52592','#c9a100','#757575',
  '#7cb342','#1a237e','#00897b','#880e4f','#827717','#64b5f6','#ff8a65','#1b5e20','#ba68c8','#5c6bc0'];
const MAX_SEL=10;   // 選べる圃場の数（軽くするため10枚まで。色は PALETTE の前から）
let pkg=null;          // {meta, parcels(GeoJSON), series:{pid:[[date,ndvi,valid],...]}}
let parcels={};        // pid -> {feature, layer, centroid:[lon,lat], name}
let selected=[];       // [{pid,color}]
let excluded=new Set(), autoFlag={};
let allDates=[];

// ---------- map ----------
const map=L.map('map',{zoomControl:true,attributionControl:true,preferCanvas:true})   // 区画は canvas で描く（数千枚の SVG より動かしたときに軽い）.setView([36.06,136.28],15);
map.createPane('pxPane').style.zIndex=390;

// 地図とサイドの境目をドラッグして幅を変える（幅はこの端末に覚えておく。ダブルクリックで元に戻す）
(function(){ const sp=document.getElementById('splitter'), lay=document.querySelector('.layout'); let raf=0, cur=0;
  const apply=w=>{ cur=Math.round(Math.max(320,Math.min(window.innerWidth-240,w))); lay.style.setProperty('--sideW',cur+'px');
    cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>map.invalidateSize({pan:false})); };
  try{ const w=+localStorage.getItem('sideW'); if(w) apply(w); }catch(e){}
  sp.addEventListener('pointerdown',e=>{ e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('drag');
    const mv=ev=>apply(window.innerWidth-ev.clientX-3);
    const up=()=>{ sp.classList.remove('drag'); sp.removeEventListener('pointermove',mv); sp.removeEventListener('pointerup',up); sp.removeEventListener('pointercancel',up);
      try{ localStorage.setItem('sideW',cur); }catch(err){} };
    sp.addEventListener('pointermove',mv); sp.addEventListener('pointerup',up); sp.addEventListener('pointercancel',up); });
  sp.addEventListener('dblclick',()=>{ lay.style.removeProperty('--sideW'); try{ localStorage.removeItem('sideW'); }catch(e){} map.invalidateSize({pan:false}); });
})();
const gsi='https://cyberjapandata.gsi.go.jp/xyz/';
const photo=L.tileLayer(gsi+'seamlessphoto/{z}/{x}/{y}.jpg',{maxZoom:18,attribution:'地理院タイル（航空写真）'});
const std=L.tileLayer(gsi+'pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル'});
// 背景「土壌図」: 淡色地図の上に、国土交通省 土地分類基本調査（20万分の1）の土壌図（data/soil_mlit.geojson）を土の種類で色分け。選んだときだけ読み込む
map.createPane('soilPane').style.zIndex=350;
const SOIL_COLS=[['#6a3d9a','泥炭土・黒泥土（軟らかい）'],['#1f5fa8','グライ土（湿田）'],['#7fb2dc','灰色低地土など'],['#e2b46a','褐色低地土・黒ボク土など（乾きやすい）'],['#9dbb86','山地の土・その他']];
const soilGeo=L.geoJSON(null,{pane:'soilPane',interactive:false,style:f=>({color:'#444',weight:.6,opacity:.6,fillColor:(SOIL_COLS[f.properties.c]||SOIL_COLS[4])[0],fillOpacity:.6})});
const soilBase=L.layerGroup([L.tileLayer(gsi+'pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル'}),soilGeo]);
let soilLoaded=null, soilOn=false;
const soilLeg=L.control({position:'topleft'}); soilLeg.onAdd=()=>{ const d=L.DomUtil.create('div','soilleg');   // 小さなボタン。押すと色の説明を開く
  d.innerHTML='<button type="button" class="sl-b">凡例</button><div class="sl-l" hidden>'+SOIL_COLS.map(([c,t])=>`<div><i style="background:${c}"></i>${t}</div>`).join('')+'<small>土地分類基本調査 1/20万</small></div><div class="sl-n"></div>';
  L.DomEvent.disableClickPropagation(d); d.querySelector('.sl-b').onclick=()=>{ const l=d.querySelector('.sl-l'); l.hidden=!l.hidden; }; return d; };
map.on('baselayerchange',e=>{ soilOn=e.layer===soilBase; map.getPane('pxPane').style.opacity=soilOn?.6:'';
  if(soilOn){ soilLeg.addTo(map);
    if(!soilLoaded) soilLoaded=fetch(`${DATA}soil_mlit.geojson`).then(r=>r.ok?r.json():null).then(j=>{ if(j) soilGeo.addData(j); else document.querySelector('.soilleg .sl-n').textContent='土壌図のデータは次の更新で作られます'; }).catch(()=>{});
  } else soilLeg.remove();
  paintMap(); });
photo.addTo(map); L.control.layers({'航空写真':photo,'淡色地図':std,'土壌図':soilBase},null,{position:'topright'}).addTo(map);
let geoLayer=null;

function ndviColor(v){ if(v==null||isNaN(v)) return '#9aa'; const t=Math.max(0,Math.min(1,(v-0.2)/0.7));
  const stops=[[0,[160,82,45]],[.33,[245,230,99]],[.66,[127,196,28]],[1,[11,107,30]]];
  for(let i=1;i<stops.length;i++){ if(t<=stops[i][0]){const a=stops[i-1],b=stops[i],u=(t-a[0])/(b[0]-a[0]); return 'rgb('+a[1].map((c,k)=>Math.round(c+(b[1][k]-c)*u)).join(',')+')';} } return '#0b6b1e'; }
function centroid(geom){ const ring=(geom.type==='Polygon'?geom.coordinates[0]:geom.coordinates[0][0]); let x=0,y=0; for(const p of ring){x+=p[0];y+=p[1];} return [x/ring.length,y/ring.length]; }
function distM(a,b){ const R=6371000,dl=(b[1]-a[1])*Math.PI/180,dn=(b[0]-a[0])*Math.PI/180*Math.cos((a[1]+b[1])/2*Math.PI/180); return R*Math.hypot(dl,dn); }

function loadPackage(p, label){
  pkg=p; parcels={}; selected=[]; excluded=new Set(); autoFlag={}; dataVer++;
  if(geoLayer) map.removeLayer(geoLayer);
  const feats=(p.parcels&&p.parcels.features)||[];
  geoLayer=L.geoJSON(feats,{
    style:f=>({color:'#fff',weight:1,opacity:.8,fillColor:'#888',fillOpacity:.35}),
    onEachFeature:(f,l)=>{ const pid=String(f.properties.pid??f.id??f.properties.name); f.properties.pid=pid;
      parcels[pid]={feature:f,layer:l,centroid:centroid(f.geometry),name:f.properties.name||pid,crop:f.properties.crop||''};
      l.on('click',()=>onParcelTap(pid)); }
  }).addTo(map);
  if(feats.length) map.fitBounds(geoLayer.getBounds().pad(0.15));
  allDates=[...new Set(Object.values(p.series||{}).flat().map(r=>r[0]))].sort();

  const all=rings.flat(2); const c0=Math.max(0,Math.floor(Math.min(...all.map(p=>p[0])))-1), c1=Math.min(m.w,Math.ceil(Math.max(...all.map(p=>p[0])))+1),
        r0=Math.max(0,Math.floor(Math.min(...all.map(p=>p[1])))-1), r1=Math.min(m.h,Math.ceil(Math.max(...all.map(p=>p[1])))+1);
  const cw=c1-c0, ch=r1-r0; if(cw<=0||ch<=0) return null;

}
function drawVigChart(svg){   // 生育傾向マップのときのグラフ: 稲の年ごとの「近くの同じ作期の田との差」（いちばん茂った時の NDVI）と、例年の値（地図の色）

  rows.forEach((q,k)=>{ if(!q.V) return; const c=q.s.color, pts=q.V.yrs.filter(a=>a.d!=null).map(a=>({i:ys.indexOf(a.y),a})).filter(p=>p.i>=0).sort((a,b)=>a.i-b.i), dx=(k-(rows.length-1)/2)*5;

let lastPick=null;
(function(){ const svg=document.getElementById('chart'),tip=document.getElementById('tip');
  const onMove=ev=>{ if(!hoverPts.length) return; const pt=ev.touches?ev.touches[0]:ev; if(ev.touches) ev.preventDefault();
    const r=svg.getBoundingClientRect(); const mx=(pt.clientX-r.left)*W/r.width; let best=null; for(const h of hoverPts){const d=Math.abs(h.px-mx); if(!best||d<best.d) best={d,h};}
    if(!best||best.d>25){lastPick=null;tip.style.display='none';svg.querySelector('#hl')?.setAttribute('visibility','hidden');return;}
    lastPick=best.h.p.date;
    const rows=hoverPts.filter(h=>Math.abs(h.x-best.h.x)<1e-6).sort((a,b)=>b.p.ndvi-a.p.ndvi); const mode=document.getElementById('mode').value;
    tip.innerHTML=`<b>${best.h.p.date}</b>`+rows.map(h=>`<div class="r"><span><i style="background:${h.s.color}"></i>${h.s.label}${h.p.ls?'（Landsat）':h.p.rad?'（レーダー推定）':''}${h.p.haze?'（速報・もやの疑い）':h.p.prov?'（速報）':''}</span><span>${h.p.ndvi.toFixed(2)}</span></div>`).join('');
    tip.style.display='block'; const hl=svg.querySelector('#hl'); hl.setAttribute('x1',best.h.px); hl.setAttribute('x2',best.h.px); hl.setAttribute('visibility','visible');
    const px=best.h.px*r.width/W; tip.style.left=(px+14+tip.offsetWidth>r.width?px-tip.offsetWidth-14:px+14)+'px'; tip.style.top=Math.max(0,(pt.clientY-r.top)-20)+'px'; };

  const pick=()=>{ const d=lastPick; if(!d) return; const sel=document.getElementById('colorDate'); if([...sel.options].some(o=>o.value===d)&&sel.value!==d){ sel.value=d; paintMap(); } };   // グラフの点をタップ → その日で地図を塗る

    t.innerHTML='<tr><th>圃場</th><th class="num">例年の育ち</th><th>目安</th><th>稲の年</th></tr>'+selected.map(s=>{
      const r=trReady[parcels[s.pid]?.cell], V=r?vigOf(s.pid,r):null, ok=V?V.yrs.filter(q=>q.d!=null):[];

    return; }
  const nb=document.getElementById('nbOn').checked?neighborSeries():null;
  t.innerHTML='<tr><th>圃場</th><th class="num">直近</th><th>日付</th><th class="num">今年の最大</th><th>日付</th>'+(nb&&nb.n?'<th class="num">近隣との差(直近)</th>':'')+'</tr>'+selected.map(s=>{
    const ser=seriesOf(s.pid).filter(p=>!p.rad); const last=ser[ser.length-1]; const y=allDates.length?allDates[allDates.length-1].slice(0,4):''; const yr=ser.filter(p=>p.date.startsWith(y)); const mx=yr.length?yr.reduce((a,b)=>b.ndvi>a.ndvi?b:a):null;

    return `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${s.color};margin-right:6px"></i><span style="color:${s.color};font-weight:700">${selLabel(s.pid)}</span></td><td class="num">${last?last.ndvi.toFixed(2):'—'}</td><td>${last?fmtD(last.date):''}</td><td class="num">${mx?mx.ndvi.toFixed(2):'—'}</td><td>${mx?fmtD(mx.date):''}</td>${nbd}</tr>`; }).join('');

    rt.add(new T.Mesh(new T.RingGeometry(0.16,0.22,48).rotateX(-Math.PI/2),rm)); rt.add(new T.Mesh(new T.CircleGeometry(0.03,16).rotateX(-Math.PI/2),rm)); rt.matrixAutoUpdate=false; rt.visible=false; rt.renderOrder=20; ar.reticle=rt; ar.scene.add(rt);
    let lost=0;
    R.setAnimationLoop((t,frame)=>{ if(!frame||!ar.on) return; try{ const ref=R.xr.getReferenceSpace(), pose=frame.getViewerPose(ref);   // setSession より前に置く（three.js の決まり）
      if(!pose){ ar.reticle.visible=false; ar.hit=null; ar.tap=false; if(++lost>15) arWarn('カメラの動きを見失いました。ゆっくり地面やあぜ・まわりの景色を映してください'); return; }   // 見失ったら描かない（古い位置の絵を出さない）

        if(1-2*(o.x*o.x+o.z*o.z)<0.94) continue; h=hp.transform; hr=x; break; }
      if(h){ ar.reticle.visible=true; ar.reticle.matrix.fromArray(h.matrix); ar.hit=[h.position.x,h.position.y,h.position.z]; if(ar.phase==='scan'){ ar.phase='c1'; arHud(); } }
      else { ar.reticle.visible=false; ar.hit=null; }
      ar.eye=pose.transform.position;
      if(ar.tap){ ar.tap=false; arTap(hr,frame,ref); }

      R.render(ar.scene,ar.cam); }catch(e){ console.error(e); } });   // 1回の失敗で AR が止まらないように
    // three.js r169 は、Chrome 147 からの新しい描き方（WebXR Layers）を通る。スマホで長く使われてきた XRWebGLLayer の描き方にする（?xrlayer=proj で新しい方）
    if(!/[?&]xrlayer=proj/.test(location.search)) try{ Object.defineProperty(s.renderState,'layers',{value:undefined,configurable:true}); }catch(e){}
    await R.xr.setSession(s); if(gone()) return;
    const vs=await s.requestReferenceSpace('viewer'); if(gone()) return;
    const src=await s.requestHitTestSource({space:vs}); if(gone()){ try{ src.cancel(); }catch(e){} return; } ar.hitSrc=src; }
  catch(e){ console.error(e); if(gone()) return; await arEnd(); const m=$('arPrepMsg'); if(m) m.textContent='AR を始められませんでした（'+(e.message||e.name)+'）'; } }
function arTap(hr,frame,ref){ if(!ar.on||!(ar.phase==='c1'||ar.phase==='c2')) return;   // 画面のタップ → リングの所を角1・角2 にする（ARCore のアンカーも置く）
  if(!ar.hit){ arWarn('地面が見つかっていません。リング（白い輪）が出ている所でタップしてください',2500); return; }
  const p=ar.hit.slice(), far=ar.eye?Math.hypot(p[0]-ar.eye.x,p[2]-ar.eye.z):0, k=ar.phase==='c1'?0:1;
  ar.anc[k]=null; if(hr&&hr.createAnchor) hr.createAnchor().then(a=>{ if(ar.on&&(k===0?ar.p1:ar.p2)===p) ar.anc[k]={a,p}; else a.delete&&a.delete(); }).catch(()=>{});
  if(k===0){ ar.p1=p; ar.pins.push(arPin(p,'角1','#ff5a1f')); ar.phase='c2'; }
  else { ar.p2=p; const a0=ar.anc[0]&&frame&&frame.getPose(ar.anc[0].a.anchorSpace,ref); if(a0){ const q=a0.transform.position; ar.p1=[q.x,q.y,q.z]; ar.anc[0].p=ar.p1; }   // 角1 はアンカーの今の位置（歩くあいだに ARCore が地図を直すことがある）
    ar.pins.push(arPin(p,'角2','#1e88e5')); arAlign(); ar.phase='show'; arPaint(); for(const q of ar.pins) q.visible=false; }   // 合わせたら、タップの印は隠す（地図の角の棒が同じ所に立つ）
  if(far>15) arWarn(`${Math.round(far)}m 先をタップしました。遠い所はずれやすいので、角の近く（数m）まで行ってタップすると正確です`,4000);
  arHud(); }
function arAnchors(frame,ref){   // ARCore が自分の地図を直すと、アンカー（角1・角2）も動く。動いたら、その2点で合わせ直す
  const a=ar.anc; if(!a[0]||!a[1]) return; const q=a.map(x=>{ const ps=frame.getPose(x.a.anchorSpace,ref); return ps?[ps.transform.position.x,ps.transform.position.y,ps.transform.position.z]:null; });
  if(!q[0]||!q[1]) return; const mv=(u,v)=>Math.hypot(u[0]-v[0],u[1]-v[1],u[2]-v[2]);
  if(mv(q[0],ar.p1)>0.02||mv(q[1],ar.p2)>0.02){ ar.p1=q[0]; ar.p2=q[1]; a[0].p=q[0]; a[1].p=q[1]; ar.pins[0]&&ar.pins[0].position.set(...q[0]); ar.pins[1]&&ar.pins[1].position.set(...q[1]); const was=ar.fitBad; arAlign(); if(was!==ar.fitBad||(ar.hudT2||0)<performance.now()-1000){ ar.hudT2=performance.now(); arHud(); } } }
function arAlign(){   // 2点で合わせる: 回転 = 地図の方位 − AR の向き、位置 = 2点の真ん中どうし、高さ = 2点の平均
  const T=AR3, M=ar.model, g2=M.P[M.c2], p1=ar.p1, p2=ar.p2, dM=Math.hypot(g2[0],g2[1]), dA=Math.hypot(p2[0]-p1[0],p2[2]-p1[2]);
  const th=Math.atan2(g2[0],g2[1])-Math.atan2(p2[0]-p1[0],-(p2[2]-p1[2]));   // 方位: 北から東まわり（three.js の −Z から +X まわり）
  const mid=new T.Vector3(g2[0]/2,0,-g2[1]/2).applyAxisAngle(new T.Vector3(0,1,0),th);
  ar.gy=(p1[1]+p2[1])/2; ar.geo.rotation.set(0,th,0); ar.geo.position.set((p1[0]+p2[0])/2-mid.x,ar.gy,(p1[2]+p2[2])/2-mid.z); ar.geo.updateMatrixWorld(true);
  ar.fit={th,dM,dA}; ar.fitBad=Math.abs(dM-dA)>=1; }   // 距離の確かめも、いま描いている2点で
function arPaint(){   // 地面に塗る: マスの色（半透明）・輪郭・頂点の番号
  const T=AR3, M=ar.model; if(ar.paint){ ar.geo.remove(ar.paint); ar.paint.traverse(o=>{ if(o.isSprite) return; if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); }); }
  const g=new T.Group(), pos=[], col=[], rib=[];
  for(const c of M.cells){ const k=new T.Color().setRGB(c.rgb[0]/255,c.rgb[1]/255,c.rgb[2]/255,T.SRGBColorSpace);
    for(const q of c.pieces) for(let i=1;i<q.length-1;i++) for(const v of [q[0],q[i],q[i+1]]){ pos.push(v[0],0,-v[1]); col.push(k.r,k.g,k.b); } }   // 切った形は凸なので扇形に分ける
  if(pos.length){ const geo=new T.BufferGeometry(); geo.setAttribute('position',new T.Float32BufferAttribute(pos,3)); geo.setAttribute('color',new T.Float32BufferAttribute(col,3));
    const m=new T.Mesh(geo,new T.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:AR_OP,side:T.DoubleSide,depthWrite:false})); m.name='cells'; g.add(m); }
  for(const p of M.parts.concat(...(M.holes||[]))) for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length], dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1, ox=-dy/L*0.12, oy=dx/L*0.12;   // 輪郭（幅 24cm の帯。穴のふちも）
    for(const q of [[a[0]-ox,a[1]-oy],[b[0]-ox,b[1]-oy],[b[0]+ox,b[1]+oy],[a[0]-ox,a[1]-oy],[b[0]+ox,b[1]+oy],[a[0]+ox,a[1]+oy]]) rib.push(q[0],0.01,-q[1]); }
  const rg=new T.BufferGeometry(); rg.setAttribute('position',new T.Float32BufferAttribute(rib,3)); const rm=new T.Mesh(rg,new T.MeshBasicMaterial({color:0xffe14d,side:T.DoubleSide,depthWrite:false})); rm.renderOrder=2; g.add(rm);
  const cs=new Set(arCornerIdx(M.P)), pm=new T.MeshBasicMaterial({color:0xffe14d}), pg=new T.CylinderGeometry(0.025,0.025,0.5,8);
  M.P.forEach((q,i)=>{ if(!cs.has(i)&&i!==M.c1&&i!==M.c2) return;   // 目印の棒は本当の角と 角1・角2 だけ
    const m=new T.Mesh(pg,pm); m.position.set(q[0],0.25,-q[1]); g.add(m);
    const s=arText(i===M.c1?'角1':i===M.c2?'角2':(i+1)+'番',i===M.c1?'#d84315':i===M.c2?'#1565c0':'rgba(0,0,0,.5)'); s.scale.set(0.8,0.4,1); s.position.set(q[0],0.75,-q[1]); g.add(s); });
  ar.paint=g; ar.geo.add(g); arLiftApply(); }
function arLiftApply(){ if(ar.paint){ ar.paint.position.y=ar.lift||0; ar.paint.updateMatrixWorld(true); } const b=document.getElementById('arValP'); if(b&&ar.phase==='show') arShowTick(true); }
function arLift(d){ ar.liftAuto=false; ar.lift=Math.round(((ar.lift||0)+d)*10)/10; arLiftApply(); arHud(); }
function arInside(M,x,y,mg){ if(!M.parts.some((p,k)=>inRing(p,x,y)&&!(M.holes&&M.holes[k]||[]).some(h=>inRing(h,x,y)))) return false; for(const p of M.parts.concat(...(M.holes||[]))) for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length], dx=b[0]-a[0], dy=b[1]-a[1], L2=dx*dx+dy*dy||1, t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/L2)); if(Math.hypot(a[0]+dx*t-x,a[1]+dy*t-y)<mg) return false; } return true; }
function arShowTick(force){ const T=AR3, M=ar.model, now=performance.now(); if(!force&&now-(ar.tickT||0)<150) return; ar.tickT=now; let txt='';
  if(ar.hit){ const q=new T.Vector3(...ar.hit); ar.geo.worldToLocal(q); const x=q.x, y=-q.z;
    if(ar.liftAuto&&arInside(M,x,y,2)){ ar.fy.push(q.y); if(ar.fy.length>40) ar.fy.shift();   // 田の中（縁から 2m 内側）で見つかった面の高さ → 塗る高さ
      if(ar.fy.length>=10){ const s=ar.fy.slice().sort((a,b)=>a-b), md=s[s.length>>1]; if(Math.abs(md)<1.5&&Math.abs(md-(ar.lift||0))>0.05){ ar.lift=Math.round(md*20)/20; ar.paint.position.y=ar.lift; ar.paint.updateMatrixWorld(true); arHud(); } } }
    const c=M.cells.find(c=>x>=c.bb[0]&&y>=c.bb[1]&&x<=c.bb[2]&&y<=c.bb[3]&&c.pieces.some(q=>inRing(q,x,y)));
    txt=c?`リングの所: <b>${escH(c.txt)}</b>`:arInside(M,x,y,0)?'リングの所: 筆の中':'リングの所: 筆の外'; }
  else txt='リングを田に向けると、その所の値を出します';
  const b=document.getElementById('arValP'); if(b&&b.innerHTML!==txt) b.innerHTML=txt; }
function arHud(){ const $=id=>document.getElementById(id), M=ar.model, ph=ar.phase, sh=ph==='show';
  $('arTitle').textContent=`${M.name}・${M.src}${M.note?'・'+M.note:''}`;
  $('arMsg').innerHTML=ph==='scan'?'スマホをゆっくり動かして、地面（あぜ・田）を映してください'
    :ph==='c1'?`白いリングを <b>角1</b>（歩きはじめる角）に合わせて、画面をタップ`
    :ph==='c2'?`あぜを歩いて <i>角2</i> へ（約${Math.round(Math.hypot(M.P[M.c2][0]-M.P[M.c1][0],M.P[M.c2][1]-M.P[M.c1][1]))}m）。リングを角2 に合わせて、画面をタップ`
    :(ar.fitBad?`<span style="color:#ff8a80">タップ位置を確認してください</span><div style="font-size:13.5px;font-weight:400">角1〜角2 の距離が 地図 ${ar.fit.dM.toFixed(1)}m・AR ${ar.fit.dA.toFixed(1)}m で ${Math.abs(ar.fit.dM-ar.fit.dA).toFixed(1)}m 違います。「やり直す」でタップし直してください</div>`
      :`合わせました（角1〜角2 地図 ${ar.fit.dM.toFixed(1)}m・AR ${ar.fit.dA.toFixed(1)}m）。ずれていたら「やり直す」`)+`<div style="font-size:13px;font-weight:400">色の高さ ${ar.lift>0?'+':''}${(ar.lift||0).toFixed(1)}m${ar.liftAuto?'（田の中に合わせて自動）':'（手で合わせた高さ）'}</div>`;
  const lg=sh&&M.legend; $('arLeg').hidden=!lg; if(lg){ $('arGrad').style.background=M.legend.grad; $('arLo').textContent=M.legend.lo; $('arHi').textContent=`${M.legend.hi} ${M.legend.unit}`; }
  $('arSk').hidden=sh; if(!sh) arSketch();
  $('arValP').hidden=!sh; $('arSrcB').hidden=!sh||AR_SRC.length<2||!!AR_FIX(); $('arUp').hidden=$('arDn').hidden=!sh; $('arSrcB').innerHTML=`色<br>${escH((M.src||'').replace(/（.*$/,''))}`; }
function arSketch(){ const cv=document.getElementById('arSk'), x=cv.getContext('2d'), M=ar.model, W=192, P=M.P;   // 北が上の、筆の形と 角1・角2
  const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]), cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2, sc=(W-44)/Math.max(10,Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  const S=p=>[W/2+(p[0]-cx)*sc,W/2-(p[1]-cy)*sc]; x.clearRect(0,0,W,W); x.lineWidth=4; x.strokeStyle='#ffe14d'; x.fillStyle='rgba(255,225,77,.2)';
  x.beginPath(); P.forEach((q,i)=>{ const s=S(q); x[i?'lineTo':'moveTo'](s[0],s[1]); }); x.closePath(); x.fill(); x.stroke();
  for(const [i,c,l,on] of [[M.c1,'#ff5a1f','1',ar.phase!=='c2'],[M.c2,'#1e88e5','2',ar.phase==='c2']]){ const s=S(P[i]); x.fillStyle=c; x.beginPath(); x.arc(s[0],s[1],on?20:14,0,7); x.fill(); x.strokeStyle='#fff'; x.lineWidth=on?4:2; x.stroke(); x.fillStyle='#fff'; x.font=`bold ${on?24:17}px sans-serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(l,s[0],s[1]+1); }
  x.fillStyle='#fff'; x.font='bold 18px sans-serif'; x.textAlign='center'; x.fillText('北↑',W/2,14); }
function arWarn(t,ms){ const w=document.getElementById('arWarn'); if(!w) return; clearTimeout(ar.warnT); if(!t){ w.hidden=true; return; } w.innerHTML=t; w.hidden=false; if(ms) ar.warnT=setTimeout(()=>{ w.hidden=true; },ms); }
const arDispose=o=>o&&o.traverse(x=>{ if(x.isSprite) return; if(x.geometry) x.geometry.dispose(); if(x.material) x.material.dispose(); });   // 文字の板の絵（ar.tex）は使い回すので消さない
function arRedo(){ if(!ar.on) return; for(const p of ar.pins){ ar.scene.remove(p); arDispose(p); } ar.pins=[]; ar.p1=ar.p2=null; ar.fit=null; for(const x of ar.anc||[]) if(x&&x.a.delete) x.a.delete(); ar.anc=[];
  if(ar.paint){ ar.geo.remove(ar.paint); arDispose(ar.paint); ar.paint=null; } ar.lift=null; ar.liftAuto=true; ar.fy=[]; ar.fitBad=false; arWarn(''); ar.phase=ar.hit?'c1':'scan'; arHud(); }
async function arNextSrc(){   // 色の出どころを切り替える（位置合わせはそのまま）
  const i=AR_SRC.findIndex(s=>s.k===ar.model.k); for(let j=1;j<=AR_SRC.length;j++){ const s=AR_SRC[(i+j)%AR_SRC.length], key=ar.model.pid+'|'+s.k+'|'+document.getElementById('colorDate').value;
    const r=await (arP.data[key]||(arP.data[key]=s.get(ar.model.pid).catch(e=>({err:e.message})))); if(r.err) continue;
    const M=ar.model; ar.model=arModel(M.pid,s.k,r,M.V,M.c1,M.c2); arPaint(); arHud(); return; } }
async function arEnd(why){   // why: 'nav'（戻るボタンで履歴がもう戻った）・'session'（AR が外から終わった）・なし（終わるボタンなど）
  if(!ar.on) return; ar.on=false; const R=ar.renderer;
  if(ar.hitSrc){ try{ ar.hitSrc.cancel(); }catch(e){} ar.hitSrc=null; }
  for(const x of ar.anc||[]) if(x&&x.a.delete) try{ x.a.delete(); }catch(e){} ar.anc=[];
  if(R) R.setAnimationLoop(null);
  if(ar.session){ const s=ar.session; ar.session=null; try{ await s.end(); }catch(e){} }
  if(R){ R.setAnimationLoop(null); R.xr.enabled=false; }
  if(ar.scene) arDispose(ar.scene); ar.scene=null; ar.pins=[]; ar.paint=null;
  document.getElementById('arView').hidden=true; arWarn('');
  if(ar.pushed&&why!=='nav') history.back(); ar.pushed=false; }
let AR_HELP=null, AR_TITLE='ARで見る', AR_FIX=()=>null, AR_EXTRA=null;   // AR_FIX: 色を決めてしまう（選ぶ欄を出さない）。AR_EXTRA: 角を選ぶ画面の上に足す欄 {html(pid), bind(el)}
//   // AR_HELP: 使い方の小窓（開発者の機能が入れる）。あれば角を選ぶ画面に「使い方」ボタンを出す
window.addEventListener('popstate',e=>{ const st=e.state||{}; if(ar.on&&!st.ar) arEnd('nav'); if(arP.on&&!st.arPrep&&!st.ar) arPrepClose(true); });   // 戻るボタン: AR → 角を選ぶ画面 → 地図
loadPriv().then(boot);
