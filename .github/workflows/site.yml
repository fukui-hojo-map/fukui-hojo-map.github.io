# 画面（site/ の index.html など、data/ 以外）だけを main で書き換えたら、公開中のサイト（gh-pages）にすぐ反映する（1〜2分）
# データ（site/data）は触らない。データの形が変わる変更のときは weekly-ndvi（手動実行）で画面とデータをまとめて出す
name: site
on:
  push:
    branches: [main]
    paths: ['site/*.html', 'site/*.svg', 'site/*.png', 'site/*.ico', 'site/*.webmanifest', 'site/*.mp4', 'site/*.webm', 'site/*.js', 'site/*.txt', 'site/models/**', 'site/three/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: main }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: gh-pages, path: pages }
      - run: |
          test -s main/site/index.html
          cd main/site
          for f in *.html *.svg *.png *.ico *.webmanifest *.mp4 *.webm *.js *.txt; do [ -f "$f" ] && cp "$f" ../../pages/"$f"; done
          [ -d models ] && mkdir -p ../../pages/models && cp -r models/. ../../pages/models/
          [ -d three ] && mkdir -p ../../pages/three && cp -r three/. ../../pages/three/
          cd ../../pages
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A . ':!data' && { git diff --cached --quiet && echo "変わりなし" || { git commit -qm "site: ${GITHUB_SHA::7}" && git push -q origin HEAD:gh-pages; }; }
