# 画面（site/ の index.html など、data/ 以外）だけを main で書き換えたら、公開中のサイト（gh-pages）にすぐ反映する（1〜2分）
# データ（site/data）は触らない。データの形が変わる変更のときは weekly-ndvi（手動実行）で画面とデータをまとめて出す
name: site
on:
  push:
    branches: [main]
    paths: ['site/*.html', 'site/*.svg', 'site/*.png', 'site/*.ico', 'site/*.webmanifest']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: pages }
      - run: |
          test -s main/site/index.html
          cd main/site
          for f in *.html *.svg *.png *.ico *.webmanifest; do [ -f "$f" ] && cp "$f" ../../pages/"$f"; done
          cd ../../pages
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A . ':!data' && { git diff --cached --quiet && echo "変わりなし" || { git commit -qm "site: ${GITHUB_SHA::7}" && git push -q origin HEAD:gh-pages; }; }
