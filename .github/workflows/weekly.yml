name: weekly-ndvi

on:
  schedule:
    # 日本時間の 5〜9月は毎日、それ以外は毎週月曜。どちらも 4:23 JST（UTC 前日 19:23。0分ちょうどは混み合って遅れやすい）
    # cron は UTC の月で判定されるので 4〜9月（UTC）で毎日起動し、最初のステップで日本時間の月・曜日を見て走るか決める
    # 新しい画像がない日はすぐ終わる。月曜は全セルを調べ直す
    - cron: '23 19 * 4-9 *'
    - cron: '23 19 * 1-3,10-12 0'
  workflow_dispatch:
    inputs:
      rebuild_cells:
        description: '区画グリッドを作り直す（筆ポリゴン更新時）'
        type: boolean
        default: false
      max_minutes:
        description: 'NDVI計算に使う時間の上限（分）'
        default: '300'
      full:
        description: '新しい画像の有無に関係なく全セルを調べる'
        type: boolean
        default: false
      lai_minutes:
        description: 'LAI（葉の量）の計算に使う時間の上限（分）。はじめの作りためは 240 など'
        default: '60'

concurrency:
  group: ndvi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write          # 定期実行が止まらないようにする（下の最後のステップ）
    env:
      PYTHONPATH: ${{ github.workspace }}/pipeline/_quiet   # エラー・警告で、計算のプログラムのソースの行をログに出さない（公開の実行の記録はだれでも見られる）
    steps:
      - name: 日本時間で今日走るか決める（5〜9月は毎日、それ以外は月曜だけ。手動実行はいつでも）
        id: gate
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          m=$(TZ=Asia/Tokyo date +%-m); w=$(TZ=Asia/Tokyo date +%u)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$m" -ge 5 ] && [ "$m" -le 9 ]; } || [ "$w" = 1 ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "今日（日本時間 ${m}月・曜日${w}）は更新しない日です"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == '1'
        with:
          persist-credentials: false
      # 計算のプログラムは非公開の置き場（fukui-hojo-map/hojo-pipeline）にある（2026-11 から）。実行のときだけ取り出して、前と同じ場所に置く。
      # 取り出したものは公開のブランチには置かない（.gitignore にも書いてある）。読むトークン PIPELINE_TOKEN は、その置き場だけを読める（1年で作り直す）
      - name: 計算のプログラムを取り出す（非公開の置き場から）
        if: steps.gate.outputs.run == '1'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fukui-hojo-map/hojo-pipeline
          ref: main
          token: ${{ secrets.PIPELINE_TOKEN }}
          persist-credentials: false
          path: _core
      - name: 取り出したプログラムを置く
        if: steps.gate.outputs.run == '1'
        run: |
          cp -r _core/pipeline _core/config.yaml _core/requirements.txt ./ && rm -rf _core
          echo "計算のプログラム: $(find ./pipeline -type f | wc -l) ファイル"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == '1'
        with:
          ref: gh-pages
          path: published
          persist-credentials: false
        continue-on-error: true
      - name: 前回データを復元
        if: steps.gate.outputs.run == '1'
        run: |
          if [ -d published/data ]; then mkdir -p site && rm -rf site/data && cp -r published/data site/data;
          elif git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "::error::公開中のデータ（gh-pages）を取り出せませんでした。空のデータで上書きしないよう中止します"; exit 1; fi

      # 機械のハマりやすさ（pipeline/wet.py）の衛星の乾きの合計。公開サイトの容量（1GB）を使わないよう、別のブランチ wet-state に置く
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == '1'
        with:
          ref: wet-state
          path: state
          persist-credentials: false
        continue-on-error: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.gate.outputs.run == '1'
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == '1'

      # 衛星データは Google Earth Engine で計算する（2026-11-25 に戻した。config.yaml の s2_backend: gee。11/14〜11/25 は Earth Engine なし＝open）。
      # 鍵（EE_*）がない・使えないときは、ここで止める（データは変えない。地図は前のまま）
      - name: Earth Engine の鍵を確かめる
        if: steps.gate.outputs.run == '1'
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          EE_PRIVATE_KEY: ${{ secrets.EE_PRIVATE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, "pipeline")
          from common import load_config, pick_backend
          cfg = load_config()
          if pick_backend(cfg) != "gee":
              print("Earth Engine を使わない設定（open）です"); sys.exit(0)
          if not (os.environ.get("EE_SERVICE_ACCOUNT") and os.environ.get("EE_PRIVATE_KEY")):
              print("::error::Earth Engine の鍵（シークレット EE_SERVICE_ACCOUNT・EE_PRIVATE_KEY・EE_PROJECT）がありません。入れてから、もう一度動かしてください（データは変えていません）"); sys.exit(1)
          from update_ndvi import GEEBackend
          GEEBackend(cfg)
          import ee
          print("Earth Engine につながりました:", ee.Number(1).add(1).getInfo() == 2)
          EOF

      # Earth Engine なし（open）のころの田の NDVI・近くの雲の割合は、雲の見分け方の名前がちがうので、そのままでは全期間（24か月）を Earth Engine で計算し直しになる（何日もかかる）。
      # そこで、切り替える前に残した Earth Engine のころの公開データ（backup-gee-20261114-gh-pages）に戻して、そのあとの日だけを計算する。方式が同じセルは何もしない（2回目からは何もしない）
      - name: Earth Engine のころのデータに戻す（方式がちがうセルだけ。1回だけ）
        if: steps.gate.outputs.run == '1'
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          sys.path.insert(0, "pipeline")
          from common import load_config, pick_backend
          cfg = load_config()
          if pick_backend(cfg) != "gee":
              sys.exit(0)
          import update_ndvi, cloudnear
          mid, D, B = update_ndvi.s2_mask_id(cfg), "site/data", "backup-gee-20261114-gh-pages"
          rd = lambda p: json.load(open(p)) if os.path.exists(p) else {}
          ids = [c["id"] for c in rd(f"{D}/index.json")["cells"]]
          need = [i for i in ids if rd(f"{D}/cells/{i}/ndvi.json").get("mask") != mid]
          cn = rd(f"{D}/cloudnear.json"); cn_need = bool(cn) and cn.get("mask") != cloudnear.MASK
          if not need and not cn_need:
              print("Earth Engine のデータのままです。戻すものはありません"); sys.exit(0)
          subprocess.run(["git", "fetch", "-q", "--depth=1", "origin", B], check=True)
          def old(path):
              r = subprocess.run(["git", "show", f"FETCH_HEAD:{path}"], capture_output=True)
              return r.stdout if r.returncode == 0 else None
          n, skip = 0, []
          for i in need:
              b = old(f"data/cells/{i}/ndvi.json"); j = json.loads(b) if b else {}
              if j.get("v") == 2 and j.get("mask") == mid:
                  open(f"{D}/cells/{i}/ndvi.json", "wb").write(b); n += 1
              else:
                  skip.append(i)        # 写しにない・方式がちがう: update_ndvi が全期間を計算し直す
          print(f"田の NDVI: {n} セルを Earth Engine のころのデータに戻しました（写しにないセル {len(skip)}: {skip[:10]}）")
          if cn_need:
              b = old("data/cloudnear.json"); j = json.loads(b) if b else {}
              if j.get("mask") == cloudnear.MASK:
                  open(f"{D}/cloudnear.json", "wb").write(b); print("近くの雲の割合も戻しました")
          EOF

      # レーダー（ndvi.json の rp・rdates・rmask と、過去の年の radar.json。約230MB）は、公開サイトの1GB の上限に収めるため、別のブランチ radar-data に置く（pipeline/radar_store.py）。
      # 計算（NDVI の更新・作物の見分け）は、これまでどおりレーダーを含む形で行い、公開のときだけ外す。最初の1回は公開中のデータにレーダーが入っているので、そのまま radar-data に置く
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == '1'
        with:
          ref: radar-data
          path: radar
          persist-credentials: false
        continue-on-error: true
      - name: レーダーのデータを公開前のデータに戻す
        if: steps.gate.outputs.run == '1'
        run: |
          rc=0; git ls-remote --exit-code --heads origin radar-data >/dev/null 2>&1 || rc=$?      # 0=ある, 2=ない
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then echo "::error::radar-data ブランチの有無を確かめられませんでした。中止します"; exit 1; fi
          if [ "$rc" = 0 ] && [ ! -d radar/cells ]; then echo "::error::radar-data ブランチはあるのに取り出せませんでした。空のデータで上書きしないよう中止します"; exit 1; fi
          python pipeline/radar_store.py restore --data site/data --store radar

      # 計算にだけ使うファイル（inner.geojson・post.json・pre.json・hist_ls.json。約140MB。地図の画面は読まない）も、公開サイトの容量（1GB）を空けるため、
      # 別のブランチ calc-data に置く（pipeline/calc_store.py。2026-11-25）。計算の前に戻し、公開するときだけ外す。取り出せないときは計算を止める
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == '1'
        with:
          ref: calc-data
          path: calc
          persist-credentials: false
        continue-on-error: true
      - name: 計算用のファイルを戻す
        if: steps.gate.outputs.run == '1'
        run: |
          rc=0; git ls-remote --exit-code --heads origin calc-data >/dev/null 2>&1 || rc=$?      # 0=ある, 2=ない
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then echo "::error::calc-data ブランチの有無を確かめられませんでした。中止します"; exit 1; fi
          if [ "$rc" = 0 ] && [ ! -d calc/cells ]; then echo "::error::calc-data ブランチはあるのに取り出せませんでした。中止します"; exit 1; fi
          mkdir -p calc
          python pipeline/calc_store.py restore --data site/data --store calc --require

      # 雲の見分け方を変えたときの計算し直し（例: 2026-11 の Earth Engine → open）は、何回かの実行に分かれることがある。
      # 途中のファイル（ndvi_next.json・cloudnear_next.json）は、公開サイトの容量（1GB）を使わないよう、別のブランチ rebuild-state に置く（終わったらブランチごと消す）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == '1'
        with:
          ref: rebuild-state
          path: next
          persist-credentials: false
        continue-on-error: true
      - name: 計算し直しの途中のファイルを戻す
        if: steps.gate.outputs.run == '1'
        run: |
          rc=0; git ls-remote --exit-code --heads origin rebuild-state >/dev/null 2>&1 || rc=$?      # 0=ある, 2=ない
          if [ "$rc" = 0 ] && [ ! -d next/data ]; then echo "::error::rebuild-state ブランチはあるのに取り出せませんでした。途中の計算を捨てないよう中止します"; exit 1; fi
          if [ -d next/data ]; then cp -r next/data/. site/data/; echo "戻した: $(find next/data -type f | wc -l) ファイル"; else echo "途中の計算はありません"; fi

      - name: 区画グリッドを作成（初回 or 指定時）
        if: ${{ steps.gate.outputs.run == '1' && (inputs.rebuild_cells == true || hashFiles('site/data/index.json') == '') }}
        run: python pipeline/build_cells.py

      # 衛星データは Google Earth Engine で計算する（EE_*）。config.yaml を open にしたときは、Sentinel-2 は AWS の公開データ、レーダーは Copernicus Data Space（CDSE_*。なければ、今ある分を残す）
      - name: NDVI を更新
        if: steps.gate.outputs.run == '1'
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          EE_PRIVATE_KEY: ${{ secrets.EE_PRIVATE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          MAX_MINUTES: ${{ inputs.max_minutes || '300' }}   # 入力はシェルの文に直接書かず、環境変数で渡す
        run: |
          case "$MAX_MINUTES" in ''|*[!0-9]*) echo "::error::max_minutes は数字で入れてください"; exit 1;; esac
          python pipeline/update_ndvi.py --max-minutes "$MAX_MINUTES" --workers 4 ${{ inputs.full && '--full' || '' }}

      # 近くの雲の割合（pipeline/cloudnear.py → data/cloudnear.json）。画面が、6〜9月に「まわり3kmの99%以上が雲」の日の観測を使わないための材料。
      # 計算済みの日は飛ばす。方式を変えたとき（Earth Engine ↔ open）は、cloudnear_next.json に全部の日を作ってから入れ替える（それまでは前のファイルを使う）。
      # 失敗しても前回のファイルが残るだけで、ほかは止めない
      - name: 近くの雲の割合を計算する
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        timeout-minutes: 40
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          EE_PRIVATE_KEY: ${{ secrets.EE_PRIVATE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: python pipeline/cloudnear.py --max-minutes 30 --workers 4

      # LAI（葉面積指数＝葉の量。pipeline/lai.py → cells/<id>/lai.json。ESA SNAP の方式を Earth Engine で）。2026-11-25〜、開発版の画面で試す（本番の画面は読まない）。
      # 計算する日は、NDVI に晴れた区画がある日（去年の1月から）。区画の内側の形（inner.geojson）を使うので、計算用のファイルを外す前に。
      # 時間切れの分は次回に続ける。失敗しても、ほかは止めない（config の lai が true でなければ何もしない）
      - name: LAI（葉の量）を計算する（開発版の画面で試す）
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        timeout-minutes: 260
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          EE_PRIVATE_KEY: ${{ secrets.EE_PRIVATE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          LAI_MINUTES: ${{ inputs.lai_minutes || '60' }}   # 入力はシェルの文に直接書かず、環境変数で渡す
        run: |
          case "$LAI_MINUTES" in ''|*[!0-9]*) echo "::error::lai_minutes は数字で入れてください"; exit 1;; esac
          [ "$LAI_MINUTES" -le 240 ] || LAI_MINUTES=240
          if [ -f pipeline/lai.py ]; then python pipeline/lai.py --max-minutes "$LAI_MINUTES" --workers 6; else echo "lai.py がないので飛ばします"; fi

      - name: 計算し直しの途中のファイルを rebuild-state ブランチに置く（公開サイトには出さない）
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf next_out && mkdir -p next_out/data
          (cd site/data && find . -name ndvi_next.json -o -name cloudnear_next.json) | while read -r f; do mkdir -p "next_out/data/$(dirname "$f")"; mv "site/data/$f" "next_out/data/$f"; done
          n=$(find next_out/data -type f | wc -l); echo "途中のファイル: $n"
          if [ "$n" -gt 0 ]; then
            bash pipeline/branch_push.sh next_out rebuild-state "rebuild state"
          elif git ls-remote --exit-code --heads origin rebuild-state >/dev/null 2>&1; then
            git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete rebuild-state && echo "計算し直しが終わったので、rebuild-state ブランチを消しました"
          fi

      - name: 最新の画面を取り込む（この更新の途中で site.yml が画面だけ出していても、古い画面で上書きしない）
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        run: git fetch -q origin main && git checkout FETCH_HEAD -- $(git ls-tree --name-only FETCH_HEAD site/ | grep -vx 'site/data')
      - name: レーダーのデータを radar-data ブランチに置く
        id: radar1
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/radar_push.sh
      - name: 計算用のファイルを calc-data ブランチに置く
        id: calc1
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/calc_store.py save --data site/data --store calc && bash pipeline/branch_push.sh calc calc-data "calc data"
      - name: 公開するデータをそろえる（radar-data・calc-data に置けたときだけ、レーダー・計算用のファイルを外す。置けなかったときは入れたまま公開する）
        if: steps.gate.outputs.run == '1'
        run: |
          rm -rf site_pub && cp -al site site_pub
          if [ "${{ steps.radar1.outcome }}" = success ]; then python pipeline/radar_store.py strip --data site_pub/data
          else echo "::warning::radar-data に置けなかったので、今回はレーダーを入れたまま公開します"; fi
          if [ "${{ steps.calc1.outcome }}" = success ]; then python pipeline/calc_store.py strip --data site_pub/data
          else echo "::warning::calc-data に置けなかったので、今回は計算用のファイルを入れたまま公開します"; fi
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: steps.gate.outputs.run == '1'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_pub
          force_orphan: true
          commit_message: 'update ndvi data'

      # 生育傾向マップ（過去の年の作物の見分けと田の中の差）。NDVI を公開したあと、残り時間で作る。
      # 最初は全セルで数日かかる（近いセルから順に。途中で切れても次回に続きから）。作った年があるときだけ公開し直す
      - name: 生育傾向マップのデータを作る
        id: trend
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          EE_PRIVATE_KEY: ${{ secrets.EE_PRIVATE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: python pipeline/trend.py --deadline $(( ${{ steps.gate.outputs.t0 }} + 300 * 60 )) --workers 4

      # 作物の見分け（稲・麦・休耕か草・その他）。全部の田・年を、そろったデータから見分け直す（4コアで4分ほど。この段は Earth Engine を使わない）
      # 入力が欠けた年は前回の見分けを残す（--prev）。失敗しても前回のファイルが残るだけで、ほかは止めない
      - name: 作物を見分ける
        id: crop
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        timeout-minutes: 30
        run: python pipeline/crop.py --data site/data --out site/data --prev site/data --no-full --workers 4

      # 生育傾向マップの田ごとの値（例年の育ち）: 稲の年ごとに、いちばん茂った時の NDVI を、近くの同じころに植えて同じころに刈った田とくらべる
      # （Earth Engine は使わない。1分ほど。消えた年は前回の vig.json から引き継ぐ。失敗しても前回の vig.json が残るだけ）
      - name: 例年の育ちを計算する
        id: vig
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        timeout-minutes: 20
        run: python pipeline/vigor.py --data site/data --out site/data --prev site/data --workers 4

      # 高低差マップ（絶対表示）の「周りの田との高さの差」（半径1km・2km）。wet.json の田の標高と田の位置から、全セルまとめて計算する（Earth Engine は使わない。1分ほど）
      - name: 周りの田との高さの差を計算する
        id: elev
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        timeout-minutes: 15
        run: python pipeline/elev_rel.py --data site/data

      - name: 乾きの合計を wet-state ブランチに保存する
        if: steps.gate.outputs.run == '1' && !cancelled()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d state/wet ] && [ -n "$(ls -A state/wet 2>/dev/null)" ] || { echo "保存するものがありません"; exit 0; }
          cd state
          [ -d .git ] || { git init -q && git checkout -q -b wet-state; }
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$url" 2>/dev/null || git remote add origin "$url"
          git config --unset-all http.https://github.com/.extraheader || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A wet && { git diff --cached --quiet && echo "変わりなし" || { git commit -qm "wet sums" && git push -q origin HEAD:wet-state; }; }

      - name: 最新の画面を取り込む（この更新の途中で site.yml が画面だけ出していても、古い画面で上書きしない）
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        run: git fetch -q origin main && git checkout FETCH_HEAD -- $(git ls-tree --name-only FETCH_HEAD site/ | grep -vx 'site/data')
      - name: レーダーのデータを radar-data ブランチに置く（作物の見分けのあとの分）
        id: radar2
        if: steps.gate.outputs.run == '1' && (steps.crop.outcome == 'success' || steps.vig.outcome == 'success' || steps.elev.outcome == 'success' || (steps.trend.outputs.made != '' && steps.trend.outputs.made != '0'))
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/radar_push.sh
      - name: 計算用のファイルを calc-data ブランチに置く（作物の見分けのあとの分）
        id: calc2
        if: steps.gate.outputs.run == '1' && (steps.crop.outcome == 'success' || steps.vig.outcome == 'success' || steps.elev.outcome == 'success' || (steps.trend.outputs.made != '' && steps.trend.outputs.made != '0'))
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/calc_store.py save --data site/data --store calc && bash pipeline/branch_push.sh calc calc-data "calc data"
      - name: 公開するデータをそろえる（radar-data・calc-data に置けたときだけ、レーダー・計算用のファイルを外す）
        if: steps.gate.outputs.run == '1' && (steps.crop.outcome == 'success' || steps.vig.outcome == 'success' || steps.elev.outcome == 'success' || (steps.trend.outputs.made != '' && steps.trend.outputs.made != '0'))
        run: |
          rm -rf site_pub && cp -al site site_pub
          if [ "${{ steps.radar2.outcome }}" = success ]; then python pipeline/radar_store.py strip --data site_pub/data
          else echo "::warning::radar-data に置けなかったので、今回はレーダーを入れたまま公開します"; fi
          if [ "${{ steps.calc2.outcome }}" = success ]; then python pipeline/calc_store.py strip --data site_pub/data
          else echo "::warning::calc-data に置けなかったので、今回は計算用のファイルを入れたまま公開します"; fi
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: steps.gate.outputs.run == '1' && (steps.crop.outcome == 'success' || steps.vig.outcome == 'success' || steps.elev.outcome == 'success' || (steps.trend.outputs.made != '' && steps.trend.outputs.made != '0'))
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_pub
          force_orphan: true
          commit_message: 'update trend, crop and vigor data'

      # GitHub は公開リポジトリで60日間動きがないと定期実行を止めるので、毎回「有効」にし直しておく
      # （手で「無効」にしたときは再び有効にしない。失敗してもジョブは止めず、警告として残す）
      - name: 定期実行を有効のままにする
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          s=$(gh api "repos/${{ github.repository }}/actions/workflows/weekly.yml" --jq .state)
          if [ "$s" = active ]; then gh workflow enable weekly.yml --repo "${{ github.repository }}"; else echo "state=$s のため有効にし直さない"; fi
