# T19 の試し（公開サイトには出さない）: 雲の近くを除く新しい計算（update_ndvi.py の cloud_near_m）を、いくつかのセルだけで動かし、
# できた ndvi_next.json / ndvi.json を diag-near-out ブランチに置く。diag-s2 ブランチに、このファイルか .github/diag-near-args.txt を push したときだけ動く
name: diag-near-test
on:
  push:
    branches: [diag-s2]
    paths: ['.github/workflows/diag-near-test.yml', '.github/diag-near-args.txt']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: "設定（引数のファイル: 1行目 セル、2行目 cloud_near_m）"
        id: a
        run: |
          echo "cells=$(sed -n 1p .github/diag-near-args.txt)" >> "$GITHUB_OUTPUT"
          echo "near=$(sed -n 2p .github/diag-near-args.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          sparse-checkout: |
            data/index.json
            data/cells/54*/parcels.geojson
            data/cells/54*/inner.geojson
            data/cells/54*/ndvi.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 試しの設定とデータ（選んだセルだけ）
        run: |
          mkdir -p site/data/cells
          cp published/data/index.json site/data/
          for c in $(echo "${{ steps.a.outputs.cells }}" | tr ',' ' '); do cp -r published/data/cells/$c site/data/cells/; done
          python -c "import yaml; c=yaml.safe_load(open('config.yaml',encoding='utf-8')); c.update({'cloud_near_m': int('${{ steps.a.outputs.near }}'), 'pixel_maps': False, 'radar': False}); yaml.safe_dump(c, open('config.yaml','w',encoding='utf-8'), allow_unicode=True)"
          grep -n "cloud_near_m\|pixel_maps\|radar:" config.yaml
      - name: 計算（選んだセルだけ）
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          EE_PRIVATE_KEY: ${{ secrets.EE_PRIVATE_KEY }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
        run: python pipeline/update_ndvi.py --cells "${{ steps.a.outputs.cells }}" --max-minutes 120 --workers 4 --full 2>&1 | tee log.txt
      - name: 結果を diag-near-out ブランチに置く
        if: always()
        run: |
          mkdir -p out && cp log.txt out/ || true
          for c in $(echo "${{ steps.a.outputs.cells }}" | tr ',' ' '); do mkdir -p out/$c; cp site/data/cells/$c/ndvi*.json out/$c/ 2>/dev/null || true; cp published/data/cells/$c/ndvi.json out/$c/ndvi_old.json; done
          cd out && git init -q && git checkout -q -b diag-near-out && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "試しの結果（雲の近くを除く計算）" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag-near-out
